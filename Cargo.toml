[package]
name = "secure-serial"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Reliable CRC-framed serial protocol with chunked packets and ACKs for no_std + Embassy"
readme = "README.md"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/secure-serial"
repository = "https://github.com/martin2250/secure-serial"
keywords = ["serial", "uart", "embassy", "embedded", "no-std"]
categories = ["embedded", "no-std"]

[features]
default = []
defmt = ["dep:defmt"]
software-crc = ["dep:crc"]

[dependencies]
defmt = { version = "1", optional = true }
crc = { version = "3.4", optional = true }

[dev-dependencies]
crc = "3.4"
critical-section = { version = "1.2", features = ["std"] }
static_cell = "2"

[[example]]
name = "simple"
required-features = ["software-crc"]
